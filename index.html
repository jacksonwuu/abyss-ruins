<!DOCTYPE html>

<style>
  html,body{margin:0;height:100%;background:#00060c;overflow:hidden;font-family:"Avenir Next","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:#cfeaf5;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c:active{cursor:grabbing}
  #title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%,#062233 0%,#01090f 62%,#000 100%);transition:opacity 2.4s ease;pointer-events:none}
  #title.hide{opacity:0}
  #title h1{margin:0;font-weight:200;font-size:clamp(26px,5vw,60px);letter-spacing:.55em;padding-left:.55em;color:#e6fbff;
    text-shadow:0 0 28px rgba(80,220,255,.55),0 0 90px rgba(80,160,255,.35);animation:rise 2.2s ease both}
  #title h1 b{font-weight:200;color:#6fe6ff;margin:0 .1em}
  #title p{margin:22px 0 0;font-size:11px;letter-spacing:.6em;padding-left:.6em;color:#5fa9bd;animation:rise 2.2s .5s ease both}
  #title .bar{margin-top:34px;width:160px;height:1px;background:rgba(120,220,255,.15);overflow:hidden}
  #title .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#7fe9ff,transparent);animation:slide 1.6s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .55s ease}
  .lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:10;transition:height 1.4s cubic-bezier(.6,0,.2,1);pointer-events:none}
  .lb.top{top:0}.lb.bot{bottom:0}
  body.cine .lb{height:9vh}
  #hud{position:fixed;left:22px;bottom:20px;z-index:12;font-size:11px;letter-spacing:.3em;color:rgba(160,230,245,.6);pointer-events:none;transition:opacity 1s}
  #hud b{font-weight:300;font-size:20px;letter-spacing:.12em;color:rgba(200,245,255,.85);display:block;margin-bottom:4px}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;font-size:11px;letter-spacing:.28em;color:rgba(170,230,245,.6);

  #snd{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:12;font-size:11px;letter-spacing:.3em;padding:8px 16px;border-radius:20px;

  .lil-gui{--background-color:rgba(6,20,32,.38);--widget-color:rgba(130,225,255,.11);--hover-color:rgba(130,225,255,.2);--focus-color:rgba(130,225,255,.28);
    --number-color:#7fe9ff;--string-color:#c3b4ff;--text-color:#cfeaf5;--title-background-color:rgba(10,34,50,.5);--title-text-color:#a8f1ff;
    --font-size:12px;--input-font-size:12px;--width:272px;--widget-height:24px;--padding:8px;--spacing:7px;--widget-border-radius:6px;

    border:1px solid rgba(140,230,255,.2);box-shadow:0 12px 44px rgba(0,0,0,.5),inset 0 0 34px rgba(60,200,255,.06)}
  .lil-gui.root>.title{letter-spacing:.3em;font-weight:400;padding:4px 10px}
  .lil-gui .controller.function .name{letter-spacing:.2em}

<body class="cine">
<canvas id="c"></canvas>
<div id="title"><h1>ABYSS<b>·</b>深渊遗迹</h1><p>THE SUNKEN CITY — 200 M BELOW</p><div class="bar"><i></i></div></div>
<div id="fade"></div><div class="lb top"></div><div class="lb bot"></div>
<div id="hud"><b id="depth">−200 M</b>DEPTH</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · WASD 游动 · Q/E 升降 · 点击水母 · ESC 跳过运镜</div>
<div id="snd">♪ 点击任意处开启声音</div>
<div id="err">无法初始化 WebGL2<br>请使用新版 Chrome 并开启硬件加速</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

/* =====================================================================
   0. 配置 / 工具
   ===================================================================== */
const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || (matchMedia('(pointer:coarse)').matches && Math.min(innerWidth, innerHeight) < 820);
const Q = isMobile
  ? { dpr: Math.min(devicePixelRatio, 1.25), fish: 140, snow: 2600, weed: 700, terrainSeg: 120, rays: 12, dof: false, msaa: 0, bloomScale: .5, rocks: 70 }
  : { dpr: Math.min(devicePixelRatio, 1.6),  fish: 300, snow: 9000, weed: 2400, terrainSeg: 230, rays: 22, dof: true,  msaa: 4, bloomScale: 1,  rocks: 150 };

const V3 = THREE.Vector3, Qt = THREE.Quaternion;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gauss = x => Math.exp(-x * x);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(20260713);
const rr = (a, b) => a + (b - a) * rnd();
const h2 = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
function vn2(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h2(xi, yi), h2(xi + 1, yi), u), lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v); }
function fbm2(x, y, o = 5) { let a = .5, s = 0; for (let i = 0; i < o; i++) { s += a * vn2(x, y); x = x * 2.02 + 13.1; y = y * 2.02 + 7.7; a *= .5; } return s; }

/** 地形高度：中央台地 → 沙丘 → 远处坠入深渊 */
function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = fbm2(x * .02 + 3.3, z * .02 + 1.7) * 11 - 5.2 + fbm2(x * .075 + 40, z * .075, 3) * 2.4 - 1.1;
  h = lerp(h, 0, ss(48, 21, r));                                   // 神殿台地
  const ds = Math.hypot(x - 46, z - 34); h = lerp(h, .4, ss(22, 8, ds) * .8); // 雕像周围平缓
  const drop = ss(100, 215, r + fbm2(x * .01, z * .01, 3) * 40 - 20);
  return h - Math.pow(drop, 1.5) * 95;
}

/* =====================================================================
   1. 渲染器 / 场景 / 相机
   ===================================================================== */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;       // ACES 在最终后期着色器里做
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .3, 1500);

/* =====================================================================
   2. 共享 uniform 与 GLSL 库
   ===================================================================== */
const U = {
  uTime: { value: 0 }, uSunColor: { value: new THREE.Color() }, uAmbient: { value: .5 }, uShallow: { value: new THREE.Color() }, uDeep: { value: new THREE.Color() },
  uFogDensity: { value: .014 }, uEyePos: { value: new V3() }, uEyeInt: { value: 0 }, uCorePos: { value: new V3(0, 9, 0) }, uCoreInt: { value: 0 },
  uJelly: { value: Array.from({ length: 5 }, () => new THREE.Vector4()) }, uJellyCol: { value: Array.from({ length: 5 }, () => new THREE.Color()) },
  uWhale: { value: new THREE.Vector4(0, 0, 0, 0) }, uRing: { value: -60 }, uRingInt: { value: 0 }, uRingOrigin: { value: new V3() },
  uRune: { value: 0 }, uPulse: { value: 0 }, uBio: { value: .4 }, uCurrent: { value: 1 }, uRayInt: { value: 1 },
};
const G_UNI = /* glsl */`
uniform float uTime; uniform vec3 uSunColor; uniform float uAmbient; uniform vec3 uShallow; uniform vec3 uDeep; uniform float uFogDensity;
uniform vec3 uEyePos; uniform float uEyeInt; uniform vec3 uCorePos; uniform float uCoreInt;
uniform vec4 uJelly[5]; uniform vec3 uJellyCol[5]; uniform vec4 uWhale;
uniform float uRing; uniform float uRingInt; uniform vec3 uRingOrigin; uniform float uRune; uniform float uPulse; uniform float uBio; uniform float uCurrent; uniform float uRayInt;
`;
const G_NOISE = /* glsl */`
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float hash31(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec3(17.1,3.7,9.2);a*=.5;}return s;}
`;
const G_LIGHT = /* glsl */`
// 流动焦散：迭代三角函数折叠（可平铺）
float caustic(vec2 uv,float t){
  vec2 p=mod(uv*6.28318,6.28318)-250.; vec2 i=p; float c=1.;
  for(int n=0;n<4;n++){ float tt=t*(1.-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/.005),p.y/(cos(i.y+tt)/.005))); }
  c/=4.; c=1.17-pow(c,1.4); return clamp(pow(abs(c),8.),0.,1.6);
}
vec3 waterColor(vec3 d){
  float h=clamp(d.y*.5+.5,0.,1.);
  return mix(uDeep,uShallow,pow(h,1.7)) + uSunColor*pow(max(d.y,0.),5.)*.3;
}
vec3 applyFog(vec3 col,vec3 wp){
  vec3 v=wp-cameraPosition; float d=length(v); float f=1.-exp(-uFogDensity*d);
  col*=mix(vec3(1.),vec3(.5,.86,1.),f);                 // 红光先被水吸收
  return mix(col,waterColor(v/max(d,1e-3)),f);
}
float whaleShadow(vec3 wp){
  vec2 d=wp.xz-uWhale.xy; vec2 dir=vec2(cos(uWhale.z),sin(uWhale.z));
  float al=dot(d,dir), ac=dot(d,vec2(-dir.y,dir.x));
  float e=(al*al)/(27.*27.)+(ac*ac)/(9.*9.);
  return 1.-uWhale.w*(1.-smoothstep(.25,1.5,e));
}
float awake(vec3 wp){ return smoothstep(0.,10.,uRing-length(wp-uRingOrigin))*uRune; }
float ringFront(vec3 wp){ float d=(length(wp-uRingOrigin)-uRing)/3.5; return exp(-d*d)*uRingInt; }
vec3 bioLights(vec3 wp,vec3 N){
  vec3 s=vec3(0.); vec3 L=uEyePos-wp; float d2=dot(L,L);
  s+=vec3(.2,.7,1.)*uEyeInt*(max(dot(N,normalize(L)),0.)*.75+.25)/(1.+d2*.02);
  L=uCorePos-wp; d2=dot(L,L);
  s+=vec3(.3,.85,1.)*uCoreInt*(max(dot(N,normalize(L)),0.)*.75+.25)/(1.+d2*.006);
  for(int i=0;i<5;i++){ L=uJelly[i].xyz-wp; d2=dot(L,L);
    s+=uJellyCol[i]*uJelly[i].w*(max(dot(N,normalize(L)),0.)*.7+.3)/(1.+d2*.045); }
  return s;
}
vec3 lightSurface(vec3 albedo,vec3 N,vec3 wp){
  float ndl=max(dot(N,normalize(vec3(.25,1.,.15))),0.);
  float c=caustic(wp.xz*.15+wp.y*.05,uTime*.55);
  float sh=whaleShadow(wp);
  vec3 sun=uSunColor*(ndl*.7+.08)*(.42+c*1.7*smoothstep(-.2,.5,N.y))*sh;
  vec3 amb=mix(uDeep*1.5,uShallow,N.y*.5+.5)*uAmbient*mix(1.,sh,.6);
  return albedo*(sun+amb+bioLights(wp,N));
}
`;
/** 统一的“水下受光”材质工厂：各物体只需填入顶点/片元片段 */
function makeLit({ defines = {}, uniforms = {}, vhead = '', vpre = '', vpost = '', fhead = '', fbody = '', ...rest }) {
  return new THREE.ShaderMaterial({
    defines, uniforms: { ...U, ...uniforms }, ...rest,
    vertexShader: G_UNI + G_NOISE + /* glsl */`
      varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec2 vUv; varying vec3 vC;
      ${vhead}
      void main(){
        vec3 p=position; vec3 n=normal; vUv=uv; vL=position;
        ${vpre}
        #ifdef USE_INSTANCING
          mat4 M=modelMatrix*instanceMatrix;
        #else
          mat4 M=modelMatrix;
        #endif
        vec4 wp=M*vec4(p,1.); vN=normalize(mat3(M)*n);
        #ifdef USE_INSTANCING_COLOR
          vC=instanceColor.rgb;
        #else
          vC=vec3(1.);
        #endif
        ${vpost}
        vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader: G_UNI + G_NOISE + G_LIGHT + /* glsl */`
      varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec2 vUv; varying vec3 vC;
      ${fhead}
      void main(){
        vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
        vec3 albedo=vec3(.5); vec3 emis=vec3(0.); float alpha=1.;
        ${fbody}
        vec3 col=applyFog(lightSurface(albedo,N,vW),vW);
        col+=emis*exp(-uFogDensity*length(vW-cameraPosition)*.45);      // 自发光穿透力更强：远处也能看见全城点亮
        gl_FragColor=vec4(col,alpha);
      }`
  });
}

/* ---------- 石材 / 沙地：裂纹、磨损、砌缝、藻类、隐藏符文 ---------- */
function makeStone(defines = {}, texScale = 1) {
  return makeLit({
    defines, uniforms: { uTexScale: { value: texScale } },
    vhead: `attribute vec3 aSeed; uniform float uTexScale; varying vec3 vT; varying vec3 vS; varying vec3 vLn;`,
    vpost: /* glsl */`
      vLn=normal;
      #ifdef USE_INSTANCING
        vec3 sc=max(vec3(length(instanceMatrix[0].xyz),length(instanceMatrix[1].xyz),length(instanceMatrix[2].xyz)),vec3(1e-4));
        vN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*(normal/(sc*sc)));
        vT=position*sc+aSeed; vS=sc;
      #else
        vT=position*uTexScale; vS=vec3(uTexScale);
      #endif`,
    fhead: /* glsl */`
      varying vec3 vT; varying vec3 vS; varying vec3 vLn;
      float sdSeg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-4),0.,1.);return length(pa-ba*h);}
      // 程序化符文：3x3 格点间的随机笔画
      float glyph(vec2 f,vec2 id){ float d=1.;
        for(int i=0;i<4;i++){ vec2 a=floor(hash22(id+float(i)*7.31)*3.)*.3+.2; vec2 b=floor(hash22(id+float(i)*3.17+11.)*3.)*.3+.2; d=min(d,sdSeg(f,a,b)); }
        return d; }
      vec3 bumpN(vec3 N,vec3 wp,float h,float k){
        vec3 sx=dFdx(wp),sy=dFdy(wp); vec2 dh=vec2(dFdx(h),dFdy(h))*k;
        vec3 r1=cross(sy,N),r2=cross(N,sx); float det=dot(sx,r1);
        vec3 r=abs(det)*N-sign(det)*(dh.x*r1+dh.y*r2); return dot(r,r)>1e-12?normalize(r):N; }`,
    fbody: /* glsl */`
      vec3 q=vT;
      float n1=fbm(q*.35), n2=fbm(q*1.7+11.), n3=vnoise(q*7.);
      float hgt=n2*.6+n3*.2;
      float act=awake(vW), front=ringFront(vW);
      #ifdef SAND
        albedo=mix(vec3(.34,.32,.26),vec3(.62,.58,.47),fbm(vW*.12));
        float rip=sin(vW.x*2.2+vW.z*.8+vnoise(vW*.25)*9.);
        float rock=1.-smoothstep(.74,.92,N.y);
        albedo=mix(albedo*(.82+.36*n3),vec3(.22,.24,.25)*(.55+.9*n2),rock);
        hgt=mix(rip*.1+n3*.12,n2*1.1,rock);
        N=bumpN(N,vW,hgt,.22);
        float vein=1.-smoothstep(0.,.03,abs(vnoise(vec3(vW.xz*.22,3.))-.5));
        float nearT=exp(-dot(vW.xz,vW.xz)*.0008);
        emis+=vec3(.08,.8,1.)*(vein*act*nearT*.55*(.6+.5*uPulse)+front*(.22+vein*1.6));
      #else
        albedo=mix(vec3(.25,.26,.26),vec3(.52,.5,.43),n1); albedo*=.68+.64*n2; albedo*=.88+.24*n3;
        // 裂纹：噪声等值线
        float cn=vnoise(q*.9+5.);
        float crack=(1.-smoothstep(0.,.035,abs(cn-.5)))*smoothstep(.3,.55,fbm(q*.22+3.));
        float cn2=vnoise(q*2.7+9.);
        crack=max(crack,(1.-smoothstep(0.,.03,abs(cn2-.5)))*smoothstep(.48,.7,n1)*.7);
        albedo*=1.-.8*crack; hgt-=crack*.7;
        vec3 an=abs(vLn);
        #ifdef BOX
          vec3 dd=(.5-abs(vL))*vS; float mn=min(dd.x,min(dd.y,dd.z)), mx=max(dd.x,max(dd.y,dd.z)); float mid=dd.x+dd.y+dd.z-mn-mx;
          float mortar=0.;
          if(an.y<.5){ if(vS.y>1.6||max(vS.x,vS.z)>2.6){          // 侧面：错缝砌筑
              float u=an.x>an.z?q.z:q.x; float row=floor(q.y/.95); float fy=fract(q.y/.95); float fx=fract(u/1.9+mod(row,2.)*.5);
              mortar=1.-smoothstep(.02,.07,min(min(fy,1.-fy)*.95,min(fx,1.-fx)*1.9)); } }
          else if(max(vS.x,vS.z)>4.){ vec2 f2=fract(q.xz/2.4); mortar=1.-smoothstep(.02,.07,min(min(f2.x,1.-f2.x),min(f2.y,1.-f2.y))*2.4); }
          albedo*=1.-.55*mortar; hgt-=mortar*.6;
          albedo*=mix(1.22,1.,smoothstep(0.,.16,mid));              // 棱角磨损发白
          albedo*=mix(1.,.62+.38*smoothstep(-.5,-.1,vL.y),step(1.,vS.y));
        #endif
        float up=smoothstep(.3,.9,N.y);
        float moss=up*smoothstep(.4,.68,fbm(q*.8+20.))+ (1.-up)*smoothstep(.58,.78,fbm(q*.5+7.))*.5;
        albedo=mix(albedo,vec3(.07,.2,.15),moss*.62);
        albedo=mix(albedo,vec3(.5,.47,.38),up*smoothstep(.5,.75,n1)*.45);   // 顶面积沙
        N=bumpN(N,vW,hgt,.16);
        #ifdef NORUNE
          emis+=vec3(.08,.8,1.)*front*.22;
        #else

    core.k = k; core.grp.position.set(0, lerp(2.6, 9.5, k), 0); core.grp.scale.setScalar(ss(12.3, 13.8, T) * (1 + burst * .25));
    U.uCoreInt.value = k * 1.6 + burst * 3; core.mat.uniforms.uInt.value = .5 + k * .9 + burst * 2.5; fx.coreStr = k + burst * 1.5;
  }
  // ⑤ 15s 高潮：光柱冲天、全城点亮
  if (T > 15) { cue('climax', () => { core.beam.visible = true; sound.padLift(); sound.pulse(1.6); sound.chime(587); });
    core.beamMat.uniforms.uInt.value = ss(15, 15.5, T) * (.4 + 1.6 * burst); fx.flash = .28 * Math.exp(-(T - 15) * 3.2); }
  else fx.flash = T > 3.5 ? .12 * Math.exp(-(T - 3.5) * 4) : 0;
  fx.bloom = burst * .3 + k * .1;
  // 鱼群：惊散 → 绕神殿成旋涡；水母升高并同步脉动；鲸鱼贴近游过
  fishState.mode = T < 12.3 ? 'normal' : T < 14 ? 'scatter' : 'vortex';
  jellyState.rise = ss(8, 17, T); jellyState.sync = T > 8 ? 1 : 0; jellyState.glow = 1 + ss(8, 15, T) * 1.0;
  if (T > 9) cue('whale', () => launchWhale(true));
  if (T > 20) cue('settle', () => sound.padSettle());
  if (T > 27) { ev.active = false; ev.awake = true; }
}

const keys = {};
function updateCamera(dt, time) {
  if (camMode === 'intro') { camT += dt; introPos(camT, camBase); introLook(camT, camLook); if (camT >= 15) { camMode = 'hold'; camT = 0; } }
  else if (camMode === 'hold') { camT += dt; camBase.copy(PEND); camLook.copy(E); if (camT >= 3) startAwaken(); }      // 停 3 秒后自动苏醒
  else if (camMode === 'awaken') { awPos(ev.T, camBase); awLook(ev.T, camLook); if (!ev.active) { camera.position.copy(camBase); camera.lookAt(camLook); enterFree(); } }
  if (camMode !== 'free') {
    camBase.y = Math.max(camBase.y, terrainH(camBase.x, camBase.z) + 1.6); camera.position.copy(camBase); camera.lookAt(camLook);
    focus = lerp(focus, clamp(camBase.distanceTo(camLook), 4, 60), 1 - Math.exp(-dt * 2));
  } else {
    const k = 1 - Math.exp(-dt * 9); yaw += (yawT - yaw) * k; pitch += (pitchT - pitch) * k;
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    const f = _ray.set(0, 0, -1).applyQuaternion(camera.quaternion), r = _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
    const thrust = (keys.ShiftLeft || keys.ShiftRight) ? 30 : 14;
    const a = _p.set(0, 0, 0).addScaledVector(f, (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0)).addScaledVector(r, (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0));
    a.y += (keys.KeyE || keys.Space ? 1 : 0) - (keys.KeyQ || keys.KeyC ? 1 : 0);
    camVel.addScaledVector(a, thrust * dt).multiplyScalar(Math.exp(-dt * 1.7));                       // 水中的惯性与阻尼
    camBase.addScaledVector(camVel, dt);
    const rr2 = Math.hypot(camBase.x, camBase.z); if (rr2 > 170) { camBase.x *= 170 / rr2; camBase.z *= 170 / rr2; }
    const gy = terrainH(camBase.x, camBase.z) + 1.4; if (camBase.y < gy) { camBase.y = gy; camVel.y = Math.max(0, camVel.y); } camBase.y = Math.min(camBase.y, 80);
    camera.position.copy(camBase);
    focus = lerp(focus, focusDistance(camBase, f), 1 - Math.exp(-dt * 3));
  }
  // 呼吸式漂浮
  camera.position.x += Math.sin(time * .37) * .07; camera.position.y += Math.sin(time * .52) * .13 + Math.sin(time * 1.1) * .02;
  camera.rotateZ(Math.sin(time * .31) * .007); camera.rotateX(Math.sin(time * .43) * .004);
  if (Math.abs(camera.fov - fovT) > .01) { camera.fov = lerp(camera.fov, fovT, 1 - Math.exp(-dt * 6)); camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}
/** 自动对焦：沿视线求最近的地形 / 碰撞体距离 */
function focusDistance(o, d) {
  let best = 60;
  for (let t = 2; t < 60; t += 1.5) { if (o.y + d.y * t < terrainH(o.x + d.x * t, o.z + d.z * t)) { best = t; break; } }
  for (const c of colliders) { const r = Math.min(c.rx, c.rz) * .85, lx = c.x - o.x, ly = c.y - o.y, lz = c.z - o.z, tc = lx * d.x + ly * d.y + lz * d.z; if (tc < 0) continue;
    const d2 = lx * lx + ly * ly + lz * lz - tc * tc; if (d2 < r * r) best = Math.min(best, Math.max(2.5, tc - Math.sqrt(r * r - d2))); }
  for (const j of jellies) { const p = j.grp.position, lx = p.x - o.x, ly = p.y - o.y, lz = p.z - o.z, tc = lx * d.x + ly * d.y + lz * d.z; if (tc > 0 && lx * lx + ly * ly + lz * lz - tc * tc < 6) best = Math.min(best, Math.max(2.5, tc)); }
  return best;
}

/* ---------- 输入 ---------- */
const pointers = new Map(); let downX = 0, downY = 0, moved = 0, pinch = 0;
function setMouse(e) { const nx = e.clientX / innerWidth * 2 - 1, ny = -(e.clientY / innerHeight * 2 - 1); mouse.dx += nx - mouse.x; mouse.dy += ny - mouse.y; mouse.x = nx; mouse.y = ny; mouse.inside = true; }
function userTakeover() { if (camMode === 'awaken' && ev.T > 20) enterFree(); }
canvas.addEventListener('pointerdown', e => { sound.init(); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); downX = e.clientX; downY = e.clientY; moved = 0;
  if (pointers.size === 2) { const p = [...pointers.values()]; pinch = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); } mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight * 2 - 1); });
canvas.addEventListener('pointermove', e => {
  setMouse(e); const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 2) { const q = [...pointers.values()], d = Math.hypot(q[0][0] - q[1][0], q[0][1] - q[1][1]); fovT = clamp(fovT - (d - pinch) * .12, 26, 82); pinch = d; return; }
  if (moved > 6) userTakeover();
  if (camMode === 'free') { const s = .0032 * camera.fov / 60; yawT -= dx * s; pitchT = clamp(pitchT - dy * s, -1.45, 1.45); }
});
const pointerEnd = e => { if (!pointers.delete(e.pointerId)) return; if (moved < 7 && e.type === 'pointerup') pickJelly(e.clientX, e.clientY); };
canvas.addEventListener('pointerup', pointerEnd); canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('pointerleave', () => { mouse.inside = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); userTakeover(); fovT = clamp(fovT + e.deltaY * .035, 26, 82); }, { passive: false });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; sound.init(); keys[e.code] = true;
  if (e.code === 'Escape' && camMode !== 'free') { if (camMode === 'intro' || camMode === 'hold') { camera.position.copy(camBase); enterFree(); } else enterFree(); }
  if (/^Key[WASDQE]$/.test(e.code)) userTakeover(); if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
/** 点击水母：受惊、发光增强并游走 */
function pickJelly(cx, cy) {
  const d = _ray.set(cx / innerWidth * 2 - 1, -(cy / innerHeight * 2 - 1), .5).unproject(camera).sub(camera.position).normalize(), o = camera.position; let best = null, bt = 1e9;
  for (const j of jellies) { const p = j.grp.position, lx = p.x - o.x, ly = p.y - .6 * j.s - o.y, lz = p.z - o.z, tc = lx * d.x + ly * d.y + lz * d.z, R = j.s * 2.1 + tc * .012;
    if (tc > 0 && lx * lx + ly * ly + lz * lz - tc * tc < R * R && tc < bt) { bt = tc; best = j; } }
  if (!best) return;
  best.startle = 1; const away = best.grp.position.clone().sub(o).normalize(); best.vel.addScaledVector(away, 5.5); best.vel.y += 3.5;
  best.home.addScaledVector(away, 9); best.home.y = clamp(best.home.y + 3, 8, 26); const hr = Math.hypot(best.home.x, best.home.z); if (hr > 60) { best.home.x *= 60 / hr; best.home.z *= 60 / hr; }
  sound.chime(520 + Math.random() * 260);
}

/* =====================================================================
   13. 昼夜预设 + 控制面板
   ===================================================================== */
const C = (r, g, b) => new THREE.Color(r, g, b);
const TOD = {
  '白天': { sun: C(.8, 1.05, 1.1), shallow: C(.03, .25, .35), deep: C(.003, .03, .065), amb: .55, rays: 1, bio: .4, exp: 1 },
  '黄昏': { sun: C(.85, .43, .26), shallow: C(.17, .11, .19), deep: C(.016, .012, .045), amb: .42, rays: .85, bio: .85, exp: 1.05 },
  '午夜': { sun: C(0, 0, 0), shallow: C(.004, .018, .04), deep: C(.0008, .004, .012), amb: .16, rays: 0, bio: 1.8, exp: 1.15 },
};
const tod = { sun: TOD['白天'].sun.clone(), shallow: TOD['白天'].shallow.clone(), deep: TOD['白天'].deep.clone(), amb: .55, rays: 1, bio: .4, exp: 1 };
const P = {
  time: '白天', current: 1, fish: Q.fish, fog: 1, bloom: 1, dof: Q.dof, volume: .8,
  replay() { sound.init(); fadeThen(() => { resetCity(); startIntro(); }); },
  awaken() { sound.init(); fadeThen(() => { startAwaken(); }); },
};
const gui = new GUI({ title: 'ABYSS · 控制台' });
gui.add(P, 'time', ['白天', '黄昏', '午夜']).name('时间');
gui.add(P, 'current', 0, 2.5, .01).name('水流强度').onChange(v => sound.setFlow(v));
gui.add(P, 'fish', 40, MAXF, 10).name('鱼群数量').onChange(v => { fishMesh.count = v; });
gui.add(P, 'fog', .3, 2.5, .01).name('雾浓度');
gui.add(P, 'bloom', 0, 2.5, .01).name('辉光强度');
gui.add(P, 'dof').name('景深虚化');
gui.add(P, 'volume', 0, 1, .01).name('音量').onChange(v => sound.setVolume(v));
gui.add(P, 'replay').name('↺  重播开场运镜');
gui.add(P, 'awaken').name('✦  唤醒古城').domElement.classList.add('wake');
if (isMobile) gui.close();
gui.domElement.addEventListener('pointerdown', () => sound.init());

/* =====================================================================
   14. 主循环
   ===================================================================== */
let lastT = performance.now(); let time = 0, fpsAcc = 0, fpsN = 0, quality = 0, warm = 0;
const depthEl = document.getElementById('depth'), _proj = new V3();
function frame() {
  requestAnimationFrame(frame);
  const nowT = performance.now(), dt = Math.min((nowT - lastT) / 1000, .05); lastT = nowT; if (!started) { composer.render(); return; }
  time += dt; frameNo++; U.uTime.value = time; finalPass.uniforms.uTime.value = time;

  // 昼夜过渡
  const tg = TOD[P.time], k = 1 - Math.exp(-dt * 1.4);
  tod.sun.lerp(tg.sun, k); tod.shallow.lerp(tg.shallow, k); tod.deep.lerp(tg.deep, k);
  tod.amb = lerp(tod.amb, tg.amb, k); tod.rays = lerp(tod.rays, tg.rays, k); tod.bio = lerp(tod.bio, tg.bio, k); tod.exp = lerp(tod.exp, tg.exp, k);
  U.uSunColor.value.copy(tod.sun); U.uShallow.value.copy(tod.shallow); U.uDeep.value.copy(tod.deep); U.uAmbient.value = tod.amb; U.uRayInt.value = tod.rays;
  U.uBio.value = tod.bio * (ev.awake || ev.active ? 1 + .6 * ss(4, 15, ev.active ? ev.T : 99) : 1);
  U.uFogDensity.value = .0135 * P.fog; U.uCurrent.value = P.current;
  const sunK = Math.max(tod.sun.r, tod.sun.g, tod.sun.b);

  if (ev.active) updateAwaken(dt, time);
  const awakeNow = ev.awake || (ev.active && ev.T > 8);
  U.uPulse.value = awakeNow ? .5 + .5 * Math.sin(jellyState.phase) : 0;
  if (ev.awake) {   // 苏醒后的稳定态：缓慢呼吸
    fx.eye = 2.2 + .5 * U.uPulse.value; fx.flash = 0; fx.bloom = .08; fx.coreStr = 1; U.uCoreInt.value = 1.6 + .5 * U.uPulse.value; core.mat.uniforms.uInt.value = 1.3 + .3 * U.uPulse.value;
    core.beamMat.uniforms.uInt.value = .35 + .1 * U.uPulse.value; if (fishState.mode === 'vortex' && time - (ev.endAt || (ev.endAt = time)) > 30) fishState.mode = 'normal';
  } else ev.endAt = 0;
  U.uEyeInt.value = fx.eye * 1.3; eyeMats.forEach(m => m.uniforms.uGlow.value = fx.eye); eyeSprites.forEach(s => { s.material.opacity = Math.min(1, fx.eye * .3); s.scale.setScalar(4 + fx.eye * 2.2); });
  if (core.grp.visible) { core.ico.rotation.y += dt * .5; core.ico.rotation.x += dt * .23; core.wire.rotation.y -= dt * .35; core.wire.rotation.z += dt * .2; core.wire2.rotation.x += dt * .15; core.wire2.rotation.y += dt * .22;
    core.grp.position.y += Math.sin(time * .9) * .004; U.uCorePos.value.copy(core.grp.position); core.halo.material.opacity = Math.min(1, U.uCoreInt.value * .28); }

  updateCamera(dt, time);
  dome.position.copy(camera.position);
  updateFish(dt, time, camera.position); updateJellies(dt, time); updateWhale(dt, sunK); updateSnow(dt, time, camera); updateBubbles(dt, time, camera.position);

  // 后期参数
  const su = scenePass.mat.uniforms; su.uFocus.value = focus; su.uDof.value = P.dof && quality < 2 ? 1 : 0;
  if (core.grp.visible) { _proj.copy(core.grp.position).project(camera); const d = camera.position.distanceTo(core.grp.position);
    su.uCoreStr.value = _proj.z < 1 ? fx.coreStr : 0; su.uCore.value.set(_proj.x * .5 + .5, _proj.y * .5 + .5, 7.5 * camera.projectionMatrix.elements[5] / d * .5); } else su.uCoreStr.value = 0;
  bloomPass.strength = (.85 + fx.bloom) * P.bloom; finalPass.uniforms.uFlash.value = fx.flash; finalPass.uniforms.uExposure.value = tod.exp;
  composer.render();

  depthEl.textContent = '−' + Math.round(clamp(200 - (camera.position.y - 8) * .9, 0, 260)) + ' M';
  // 自适应画质：帧率不足时逐级降低分辨率，再关闭景深
  if ((warm += dt) > 5) { fpsAcc += dt; fpsN++; if (fpsAcc > 2.5) { const fps = fpsN / fpsAcc; fpsAcc = fpsN = 0;
    if (fps < 47 && quality < 3) { quality++; renderer.setPixelRatio(Math.max(.6, renderer.getPixelRatio() * .82)); resize(); } } }
}
// 标题画面：预编译着色器后淡出进入场景
camera.position.set(-52, 82, -46); camera.lookAt(-34, 30, -22);
const todInit = TOD['白天']; U.uSunColor.value.copy(todInit.sun); U.uShallow.value.copy(todInit.shallow); U.uDeep.value.copy(todInit.deep);
requestAnimationFrame(() => {
  try { renderer.compile(scene, camera); } catch (e) { /* 忽略：首帧会自行编译 */ }
  frame();
  setTimeout(() => { document.getElementById('title').classList.add('hide'); started = true; lastT = performance.now(); startIntro(); }, 1900);
});
window.__abyss = { ev, P, startAwaken, enterFree, camBase, get mode() { return camMode; }, set t(v) { ev.T = v; }, setCam(x, y, z, yw, pt) { enterFree(); camBase.set(x, y, z); yaw = yawT = yw; pitch = pitchT = pt; } };
</script>
